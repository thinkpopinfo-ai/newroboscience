[build]
  command = "node src/build.js"
  publish = "dist"
  # Publish in batches (Mon/Thu morning) to stay within 300 credits/month; see scripts/netlify-ignore.js
  ignore = "node scripts/netlify-ignore.js"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
